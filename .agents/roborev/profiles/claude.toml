# Optional personal profile: merge these tables into ~/.roborev/config.toml.
# Do not replace that file or copy these tables into the tracked repo config.
# Rubrics remain in the repo. Unique global types are required for v0.69.0 validation.
# Select this panel only in mobgap checkouts containing .agents/roborev/.

[review.types.mobgap-claude-full-stack]
template = ".agents/roborev/full-stack.md"
[review.types.mobgap-claude-full-stack.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.mobgap-claude-plan-conformance]
template = ".agents/roborev/plan-conformance.md"
[review.types.mobgap-claude-plan-conformance.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.mobgap-claude-conventions]
template = ".agents/roborev/conventions.md"
[review.types.mobgap-claude-conventions.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.mobgap-claude-simplicity]
template = ".agents/roborev/simplicity.md"
[review.types.mobgap-claude-simplicity.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.mobgap-claude-scientific-correctness]
template = ".agents/roborev/scientific-correctness.md"
[review.types.mobgap-claude-scientific-correctness.includes]
guidance = ".agents/roborev/guidance.md"

[review.subagents.mobgap_claude_full_stack]
agent = "claude-code"
model = "opus"
reasoning = "high"
review_type = "mobgap-claude-full-stack"

[review.subagents.mobgap_claude_plan_conformance]
agent = "claude-code"
model = "opus"
reasoning = "high"
review_type = "mobgap-claude-plan-conformance"

[review.subagents.mobgap_claude_conventions]
agent = "claude-code"
model = "sonnet"
reasoning = "high"
review_type = "mobgap-claude-conventions"

[review.subagents.mobgap_claude_simplicity]
agent = "claude-code"
model = "opus"
reasoning = "high"
review_type = "mobgap-claude-simplicity"

[review.subagents.mobgap_claude_scientific_correctness]
agent = "claude-code"
model = "opus"
reasoning = "high"
review_type = "mobgap-claude-scientific-correctness"

[review.panels.mobgap_claude]
members = ["mobgap_claude_full_stack", "mobgap_claude_plan_conformance", "mobgap_claude_conventions", "mobgap_claude_simplicity", "mobgap_claude_scientific_correctness"]
synthesis_agent = "claude-code"
synthesis_model = "opus"
